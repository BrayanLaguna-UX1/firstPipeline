
services:
  db:
    image: postgres
    container_name: mydb
    restart: always
    environment:
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
      POSTGRES_DB: ${{ secrets.DB_NAME }}
      POSTGRES_USER: ${{ secrets.DB_USER }}
    volumes:
      - postgrevolumen:/var/lib/postgresql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 40s
      retries: 5
      start_period: 40s
      timeout: 40s
  backend:
    image: docker_app-backend
    container_name: myback
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

volumes:
  postgrevolumen:

networks:
  backend_net:
  frontend_net: